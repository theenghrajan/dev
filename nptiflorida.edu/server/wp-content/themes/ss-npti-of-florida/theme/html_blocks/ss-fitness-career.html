<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ss_fitness-career — Section Preview</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <section
    id="ss-fitness-career"
    class="ss-module-fitness-career bg-blue-08 relative overflow-hidden pad-section"
  >

    <!-- Decorative watermark pattern (opacity-80 over bg-blue-08) -->
    <!-- acf: background_watermark (image) -->
    <img
      src="https://www.figma.com/api/mcp/asset/54a32fcc-3e28-4dce-8075-773e90f2cd01"
      alt=""
      aria-hidden="true"
      class="absolute inset-0 w-full h-full object-cover opacity-80 pointer-events-none"
    >

    <!-- Content -->
    <div class="relative z-10 container mx-auto px-4">
      <div class="col-center-center-16 text-center">

        <!-- acf: section_heading (text) -->
        <h2 class="text-center">
          Ready to Start <span class="text-orange">Your Fitness Career?</span>
        </h2>

        <!-- acf: section_subtext (textarea) -->
        <p class="text-center max-w-2xl mx-auto">
          Find a location near you and enroll today in one of our comprehensive certification programs.
        </p>

        <!-- CTAs -->
        <div class="row-center-center gap-4 flex-wrap">
          <!-- acf: primary_cta_label (text) + primary_cta_url (url) -->
          <a href="#" class="btn-primary btn-primary:hover">
            Apply Now
          </a>
          <!-- acf: secondary_cta_label (text) + secondary_cta_url (url) -->
          <a href="#" class="btn-secondary btn-secondary:hover">
            See Program Info
          </a>
        </div>

      </div>
    </div>

  </section>

</body>
</html>
