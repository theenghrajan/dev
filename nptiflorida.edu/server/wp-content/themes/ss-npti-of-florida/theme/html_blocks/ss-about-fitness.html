<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ss-about-fitness — Section Preview</title>
  <link rel="stylesheet" href="../../theme/style.css">
</head>

<body class="bg-white">

  <section
    id="ss-about-fitness"
    class="ss-module-about-fitness relative overflow-hidden min-h-[344px] flex items-center justify-center"
  >

    <!-- acf: background_image (image) -->
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
      <img
        src="https://www.figma.com/api/mcp/asset/87a90dec-ce91-48f2-a7fa-626b0b815346"
        alt=""
        class="absolute inset-0 w-full h-full object-cover"
      >
      <!-- Gradient overlay: navy/90 → blue/90 left-to-right -->
      <div class="absolute inset-0 bg-gradient-to-r from-navy/90 to-blue/90"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 container mx-auto px-4 py-12 md:py-16 flex flex-col items-center gap-6 text-center">

      <div class="flex flex-col items-center gap-3">

        <!-- acf: section_heading (text) -->
        <h2 class="font-heading font-bold text-3xl md:text-4xl text-white leading-tight max-w-prose">
          Don't Just Read About Fitness—Master It.
        </h2>

        <!-- acf: section_subheading (textarea) -->
        <p class="font-body font-normal text-md text-white/90 leading-relaxed max-w-prose">
          Join our community of future trainers. Get the latest salary guides, workout techniques,
          and career tips sent directly to your inbox.
        </p>

      </div>

      <!-- CTAs -->
      <div class="flex flex-col sm:flex-row items-center gap-4">

        <!-- acf: cta_primary_label (text) + acf: cta_primary_url (url) -->
        <a
          href="#"
          class="inline-flex items-center justify-center bg-orange hover:bg-orange/90 text-white font-body font-bold text-sm uppercase rounded-4xl px-9 py-2.5 transition-colors"
        >
          See Program Info
        </a>

        <!-- acf: cta_secondary_label (text) + acf: cta_secondary_url (url) -->
        <a
          href="#"
          class="inline-flex items-center justify-center bg-white hover:bg-orange/10 text-orange font-body font-bold text-sm uppercase rounded-4xl px-9 py-2.5 border-1.5 border-orange transition-colors"
        >
          Apply Now
        </a>

      </div>

    </div>

  </section>

</body>
</html>
