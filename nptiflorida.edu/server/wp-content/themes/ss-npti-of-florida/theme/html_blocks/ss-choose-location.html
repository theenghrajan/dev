<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ss-choose-location — Section Preview</title>
  <link rel="stylesheet" href="../../theme/style.css">
</head>

<body class="bg-white">

  <section
    id="ss-choose-location"
    class="ss-module-choose-location bg-white py-10 md:py-16 lg:py-20"
  >
    <div class="container mx-auto px-4">

      <!-- Heading -->
      <!-- acf: section_heading (text) -->
      <h2 class="font-heading font-bold text-3xl md:text-4xl text-navy text-center leading-tight mb-10 md:mb-12">
        Choose Your <span class="text-orange">Preferred Location:</span>
      </h2>

      <!-- Orlando Location -->
      <div class="flex flex-col gap-4 mb-10 md:mb-12">

        <!-- acf: location_1_name (text) -->
        <h3 class="font-heading font-bold text-xl text-navy text-center">
          Orlando Location
        </h3>

        <!-- acf: orlando_programs (repeater) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

          <!-- Program 1 -->
          <div class="bg-white border border-navy/10 rounded-2xl p-4 flex flex-col gap-4 items-center">
            <!-- acf: program_label (text) -->
            <p class="font-ui font-semibold text-xl text-navy text-center leading-snug">
              Apply For Personal Fitness Training
            </p>
            <!-- acf: program_apply_url (url) -->
            <a
              href="#"
              class="inline-flex items-center justify-center w-full bg-orange hover:bg-orange/90 text-white font-body font-bold text-sm uppercase rounded-4xl px-8 py-3 transition-colors text-center"
            >
              Apply Now
            </a>
          </div>

          <!-- Program 2 -->
          <div class="bg-white border border-navy/10 rounded-2xl p-4 flex flex-col gap-4 items-center">
            <p class="font-ui font-semibold text-xl text-navy text-center leading-snug">
              Apply For Advanced Personal Fitness Training
            </p>
            <a
              href="#"
              class="inline-flex items-center justify-center w-full bg-orange hover:bg-orange/90 text-white font-body font-bold text-sm uppercase rounded-4xl px-8 py-3 transition-colors text-center"
            >
              Apply Now
            </a>
          </div>

          <!-- Program 3 -->
          <div class="bg-white border border-navy/10 rounded-2xl p-4 flex flex-col gap-4 items-center">
            <p class="font-ui font-semibold text-xl text-navy text-center leading-snug">
              Apply For Personal Training Specialist
            </p>
            <a
              href="#"
              class="inline-flex items-center justify-center w-full bg-orange hover:bg-orange/90 text-white font-body font-bold text-sm uppercase rounded-4xl px-8 py-3 transition-colors text-center"
            >
              Apply Now
            </a>
          </div>

        </div>

      </div>

      <!-- Tampa Location -->
      <div class="flex flex-col gap-4">

        <!-- acf: location_2_name (text) -->
        <h3 class="font-heading font-bold text-xl text-navy text-center">
          Tampa Location
        </h3>

        <!-- acf: tampa_programs (repeater) — single card, centered -->
        <div class="flex justify-center">
          <div class="bg-white border border-navy/10 rounded-2xl p-4 flex flex-col gap-4 items-center w-full sm:w-[410px]">
            <!-- acf: program_label (text) -->
            <p class="font-ui font-semibold text-xl text-navy text-center leading-snug">
              Start Application
            </p>
            <!-- acf: program_apply_url (url) -->
            <a
              href="#"
              class="inline-flex items-center justify-center w-full bg-orange hover:bg-orange/90 text-white font-body font-bold text-sm uppercase rounded-4xl px-8 py-3 transition-colors text-center"
            >
              Apply Now
            </a>
          </div>
        </div>

      </div>

    </div>
  </section>

</body>
</html>
