<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ss_grid-fitness — Section Preview</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <section
    id="ss-grid-fitness"
    class="ss-module-grid-fitness relative overflow-hidden pad-section"
  >

    <!-- acf: background_image (image) -->
    <img
      src="https://www.figma.com/api/mcp/asset/c068cbdb-4480-49c9-9441-2f58c642f7dd"
      alt=""
      aria-hidden="true"
      class="absolute inset-0 w-full h-full object-cover pointer-events-none"
    >

    <!-- Gradient overlay: blue → navy -->
    <div
      class="absolute inset-0 pointer-events-none"
      style="background: linear-gradient(to right, rgba(4,76,171,0.9), rgba(23,42,54,0.9));"
    ></div>

    <!-- Content -->
    <div class="relative z-10 container mx-auto px-4">
      <div class="col-center-center-16 text-white text-center">

        <!-- acf: section_heading (text) -->
        <h2 class="text-white text-center">
          Ready to start your fitness career with us
        </h2>

        <!-- acf: section_subtext (textarea) -->
        <p class="text-white text-center max-w-2xl mx-auto">
          Take the first step toward becoming a certified fitness professional today. Our expert team is here to guide you every step of the way.
        </p>

        <!-- acf: cta_label (text) + cta_url (url) -->
        <a href="#" class="btn btn-primary btn-primary:hover">
          Apply Now
        </a>

      </div>
    </div>

  </section>

</body>
</html>
