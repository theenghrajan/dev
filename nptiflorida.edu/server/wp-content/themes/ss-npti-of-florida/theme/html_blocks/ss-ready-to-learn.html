<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ss-ready-to-learn — Section Preview</title>
  <link rel="stylesheet" href="../../theme/style.css">
</head>

<body class="bg-white">

  <section
    id="ss-ready-to-learn"
    class="ss-module-ready-to-learn relative overflow-hidden min-h-[280px] md:min-h-[344px] flex items-center justify-center"
  >

    <!-- Background image + solid blue overlay -->
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
      <!-- acf: background_image (image) -->
      <img
        src="https://www.figma.com/api/mcp/asset/d9e05d18-d82b-457f-9241-57c53299eb9b"
        alt=""
        class="absolute inset-0 w-full h-full object-cover object-center"
      >
      <div class="absolute inset-0 bg-blue/80"></div>
    </div>

    <!-- Content — centered -->
    <div class="relative z-10 container mx-auto px-4 py-12 md:py-16 flex flex-col items-center gap-6 text-center">

      <div class="flex flex-col gap-3">

        <!-- acf: section_heading (text) -->
        <h2 class="font-heading font-bold text-3xl md:text-4xl lg:text-5xl text-white leading-tight">
          Ready to Learn Directly From Experts?
        </h2>

        <!-- acf: section_subheading (text) -->
        <p class="font-body font-normal text-md text-white/90 leading-relaxed max-w-2xl mx-auto">
          Take your fitness career to the next level with insights and advice from industry professionals.
        </p>

      </div>

      <!-- CTAs -->
      <div class="flex flex-col sm:flex-row items-center gap-4">

        <!-- acf: cta_primary_label (text) + acf: cta_primary_url (url) -->
        <a
          href="#"
          class="inline-flex items-center justify-center bg-orange hover:bg-orange/90 text-white font-body font-bold text-sm uppercase rounded-4xl px-9 py-3 transition-colors"
        >
          Apply Now
        </a>

        <!-- acf: cta_secondary_label (text) + acf: cta_secondary_url (url) -->
        <a
          href="#"
          class="inline-flex items-center justify-center bg-white hover:bg-orange/10 text-orange font-body font-bold text-sm uppercase rounded-4xl px-9 py-3 border-1.5 border-orange transition-colors"
        >
          See Program Info
        </a>

      </div>

    </div>

  </section>

</body>
</html>
