<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ss_as-seen-on-fox — Section Preview</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <section id="ss-as-seen-on-fox" class="ss-module-as-seen-on-fox bg-white pad-section relative overflow-hidden">

    <!-- acf: bg_image (image) — faint watermark -->
    <div class="absolute inset-0 pointer-events-none opacity-10">
      <img src="https://www.figma.com/api/mcp/asset/6ada1c4f-afbc-43a8-97c8-34be5927008e" alt="" aria-hidden="true"
        class="w-full h-full object-cover">
    </div>

    <div class="container mx-auto px-4 relative">
      <div class="col-center-center-16 text-center flex flex-col justify-center items-center gap-10">

        <!-- acf: section_heading (text) -->
        <h2 class="text-center">
          As Seen <span class="text-orange">On Fox</span>
        </h2>

        <!-- acf: channel_logo (image) -->
        <img src="https://www.figma.com/api/mcp/asset/07013236-b326-41e3-87a9-7c2b34741b72" alt="Fox 35 Orlando"
          class="w-[200px] md:w-[264px] h-auto">

        <!-- acf: video_thumbnail (image) -->
        <div class="w-full max-w-[943px] max-h-[40rem] h-[35rem] mx-auto rounded-xl overflow-hidden shadow-card">
            <!-- 16:9 Aspect Ratio -->
            <iframe class="relative top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/qcUTYakn1kg"
              title="YouTube video" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
        </div>

      </div>
    </div>
  </section>

</body>

</html>
