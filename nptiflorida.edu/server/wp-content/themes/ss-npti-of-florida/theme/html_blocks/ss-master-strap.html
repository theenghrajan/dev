<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ss-master-strap — Section Preview</title>
  <link rel="stylesheet" href="../../theme/style.css">
</head>

<body class="bg-white">

  <section
    id="ss-master-strap"
    class="ss-module-master-strap relative overflow-hidden min-h-[280px] md:min-h-[344px] flex items-center"
  >

    <!-- acf: background_image (image) -->
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
      <img
        src="https://www.figma.com/api/mcp/asset/9d0ca9f1-d247-4d50-936a-7084ec9cb40b"
        alt=""
        class="absolute inset-0 w-full h-full object-cover object-center"
      >
      <!-- Gradient: transparent on the left fading to solid blue on the right -->
      <div class="absolute inset-0 bg-gradient-to-r from-blue/10 via-blue/70 to-blue"></div>
    </div>

    <!-- Content — right-aligned on desktop, centered on mobile -->
    <div class="relative z-10 container mx-auto px-4 py-12 md:py-16 flex justify-center md:justify-end">

      <div class="flex flex-col gap-6 text-center md:text-left w-full md:w-7/12 lg:w-5/12">

        <div class="flex flex-col gap-3">

          <!-- acf: section_heading (text) -->
          <h2 class="font-heading font-bold text-3xl md:text-4xl lg:text-5xl text-white leading-tight">
            Ready to Master Strap Training?
          </h2>

          <!-- acf: section_subheading (textarea) -->
          <p class="font-body font-normal text-md text-white/90 leading-relaxed">
            Join our certification program and add this versatile, in-demand specialization to your fitness services.
          </p>

        </div>

        <!-- CTAs -->
        <div class="flex flex-col sm:flex-row items-center gap-4 justify-center md:justify-start">

          <!-- acf: cta_primary_label (text) + acf: cta_primary_url (url) -->
          <a
            href="#"
            class="inline-flex items-center justify-center bg-orange hover:bg-orange/90 text-white font-body font-bold text-sm uppercase rounded-4xl px-9 py-3 transition-colors"
          >
            Apply Now
          </a>

          <!-- acf: cta_secondary_label (text) + acf: cta_secondary_url (url) -->
          <a
            href="#"
            class="inline-flex items-center justify-center bg-white hover:bg-orange/10 text-orange font-body font-bold text-sm uppercase rounded-4xl px-9 py-3 border-1.5 border-orange transition-colors"
          >
            See Program Info
          </a>

        </div>

      </div>

    </div>

  </section>

</body>
</html>
